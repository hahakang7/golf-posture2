<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팔 관절 라벨링</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-2: #262a32;
    --line: #353a45;
    --text: #e8eaee;
    --muted: #98a0ad;
    --accent: #ffd34d;
    --ok: #5bd18b;
    --font: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .progress { flex: 1 1 160px; min-width: 140px; max-width: 320px; }
  .progress-bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress-bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  .progress small { color: var(--muted); }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  aside { width: 290px; background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .now { padding: 10px 12px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--accent); }
  .now .label { color: var(--muted); font-size: 12px; }
  .now .joint { font-size: 20px; font-weight: 700; }
  .now .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  ol.joints { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  ol.joints li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); font-size: 13px; }
  ol.joints li.active { outline: 1px solid var(--accent); }
  ol.joints li .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  ol.joints li .state { margin-left: auto; color: var(--muted); font-size: 12px; }
  .keys { color: var(--muted); font-size: 12.5px; }
  .keys b { color: var(--text); font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .keys p { margin: 0 0 6px; }
  .frame-info { font-size: 12.5px; color: var(--muted); }
  .frame-info strong { color: var(--text); }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  @media (max-width: 760px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>팔 관절 라벨링</h1>
  <div class="progress">
    <div class="progress-bar"><i id="bar"></i></div>
    <small id="progressText"></small>
  </div>
  <button id="prev" title="이전 프레임 (←)">◀ 이전</button>
  <button id="next" title="다음 프레임 (→ / Enter)">다음 ▶</button>
  <button id="export" class="primary" title="라벨을 JSON 파일로 저장">내보내기</button>
  <button id="import" title="이전에 내보낸 JSON 불러오기">불러오기</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</header>
<main>
  <div id="stage">
    <canvas id="view" aria-label="라벨링할 프레임"></canvas>
    <div id="toast" role="status"></div>
  </div>
  <aside>
    <div class="now" id="now">
      <div class="label">지금 찍을 관절</div>
      <div class="joint" id="nowJoint"></div>
      <div class="hint">선수 본인 기준입니다. 정면 촬영이면 선수의 오른팔은 보통 화면 왼쪽에 보입니다.</div>
    </div>
    <ol class="joints" id="joints"></ol>
    <div class="frame-info" id="frameInfo"></div>
    <div class="keys">
      <p><b>클릭</b> 관절 위치 찍기 · <b>점 드래그</b> 위치 수정</p>
      <p><b>휠</b> 확대/축소 · <b>빈 곳 드래그</b> 이동 · <b>R</b> 화면 맞춤</p>
      <p><b>O</b> 안 보이는 관절 (건너뛰기)</p>
      <p><b>Backspace / Z</b> 마지막 점 취소 · <b>Delete</b> 이 프레임 초기화</p>
      <p><b>← →</b> 이전/다음 프레임</p>
      <p>관절 중심을 최대한 확대해서 찍어 주세요. 자동 저장되며, 끝나면 <b>내보내기</b>를 누르세요.</p>
    </div>
  </aside>
</main>
<script>
const TASKS = /*__TASKS__*/[];

const JOINTS = [
  { key: "RIGHT_SHOULDER", name: "오른쪽 어깨", arm: "right" },
  { key: "RIGHT_ELBOW",    name: "오른쪽 팔꿈치", arm: "right" },
  { key: "RIGHT_WRIST",    name: "오른쪽 손목", arm: "right" },
  { key: "LEFT_SHOULDER",  name: "왼쪽 어깨", arm: "left" },
  { key: "LEFT_ELBOW",     name: "왼쪽 팔꿈치", arm: "left" },
  { key: "LEFT_WRIST",     name: "왼쪽 손목", arm: "left" },
];
const COLORS = { right: "#ff6b5b", left: "#4db8ff" };
const STORE_KEY = "armLabels_v1";
const HIT_RADIUS = 12;
const DRAG_THRESHOLD = 4;
const MIN_ZOOM = 0.2, MAX_ZOOM = 40;

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const images = TASKS.map(t => { const im = new Image(); im.src = t.image; return im; });

let labels = loadLabels();          // { taskId: { RIGHT_SHOULDER: [x,y] | null, ... } }  (original-frame pixels)
let index = firstUnfinished();
let view = { zoom: 1, x: 0, y: 0 }; // image px -> canvas css px: screen = img * zoom + (x, y)
let cursor = null;
let drag = null;

// ---------------------------------------------------------------- persistence
function loadLabels() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveLabels() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(labels)); } catch (e) { toast("브라우저 저장 실패: 내보내기로 직접 저장하세요"); }
}
function decided(id) { const l = labels[id] || {}; return JOINTS.filter(j => j.key in l).length; }
function isDone(id) { return decided(id) === JOINTS.length; }
function firstUnfinished() { const i = TASKS.findIndex(t => !isDone(t.id)); return i < 0 ? 0 : i; }

// ---------------------------------------------------------------- helpers
const task = () => TASKS[index];
const current = () => labels[task().id] || (labels[task().id] = {});
function nextJointIndex() { const l = current(); return JOINTS.findIndex(j => !(j.key in l)); }
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}
// image-pixel coordinates are in the downscaled embedded image; labels are stored in original-frame pixels.
const toImage = (p) => [p[0] * task().scale, p[1] * task().scale];
const toOriginal = (p) => [p[0] / task().scale, p[1] / task().scale];
const imgToScreen = (p) => [p[0] * view.zoom + view.x, p[1] * view.zoom + view.y];
const screenToImg = (p) => [(p[0] - view.x) / view.zoom, (p[1] - view.y) / view.zoom];

function fitView() {
  const im = images[index], w = canvas.clientWidth, h = canvas.clientHeight;
  const zoom = Math.min(w / im.naturalWidth, h / im.naturalHeight) || 1;
  view = { zoom, x: (w - im.naturalWidth * zoom) / 2, y: (h - im.naturalHeight * zoom) / 2 };
}

function pointAt(sx, sy) {
  const l = current();
  let best = null, bestD = HIT_RADIUS;
  for (const j of JOINTS) {
    const p = l[j.key];
    if (!p) continue;
    const [px, py] = imgToScreen(toImage(p));
    const d = Math.hypot(px - sx, py - sy);
    if (d <= bestD) { best = j.key; bestD = d; }
  }
  return best;
}

// ---------------------------------------------------------------- drawing
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.fillStyle = "#0b0c0e"; ctx.fillRect(0, 0, w, h);
  const im = images[index];
  if (im.complete && im.naturalWidth) {
    ctx.imageSmoothingEnabled = view.zoom < 3;
    ctx.drawImage(im, view.x, view.y, im.naturalWidth * view.zoom, im.naturalHeight * view.zoom);
  }
  const l = current();
  for (const arm of ["right", "left"]) {
    const pts = JOINTS.filter(j => j.arm === arm).map(j => l[j.key] ? imgToScreen(toImage(l[j.key])) : null);
    ctx.strokeStyle = COLORS[arm]; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.8;
    for (let i = 0; i < 2; i++) if (pts[i] && pts[i + 1]) { ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[i + 1]); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  for (const j of JOINTS) {
    const p = l[j.key];
    if (!p) continue;
    const [sx, sy] = imgToScreen(toImage(p));
    ctx.strokeStyle = COLORS[j.arm]; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 10, sy); ctx.lineTo(sx + 10, sy); ctx.moveTo(sx, sy - 10); ctx.lineTo(sx, sy + 10); ctx.stroke();
    ctx.fillStyle = COLORS[j.arm]; ctx.font = "12px sans-serif";
    ctx.fillText(j.name.replace("오른쪽 ", "R ").replace("왼쪽 ", "L "), sx + 10, sy - 8);
  }
  if (cursor) {
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cursor[0], 0); ctx.lineTo(cursor[0], h); ctx.moveTo(0, cursor[1]); ctx.lineTo(w, cursor[1]); ctx.stroke();
  }
}

// ---------------------------------------------------------------- side panel
function refreshPanel() {
  const l = current(), next = nextJointIndex();
  const list = document.getElementById("joints"); list.textContent = "";
  JOINTS.forEach((j, i) => {
    const li = document.createElement("li"); if (i === next) li.className = "active";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = COLORS[j.arm];
    const name = document.createElement("span"); name.textContent = j.name;
    const state = document.createElement("span"); state.className = "state";
    state.textContent = !(j.key in l) ? "" : (l[j.key] === null ? "안 보임" : "✓");
    li.append(dot, name, state); list.append(li);
  });
  const now = document.getElementById("nowJoint");
  now.textContent = next < 0 ? "이 프레임 완료 → 다음으로" : JOINTS[next].name;
  now.style.color = next < 0 ? "var(--ok)" : COLORS[JOINTS[next].arm];
  const t = task();
  const info = document.getElementById("frameInfo"); info.textContent = "";
  const strong = document.createElement("strong"); strong.textContent = `${index + 1} / ${TASKS.length}`;
  info.append(strong, ` · ${t.video} · ${t.event_name}`);
  const done = TASKS.filter(x => isDone(x.id)).length;
  document.getElementById("bar").style.width = (100 * done / TASKS.length) + "%";
  document.getElementById("progressText").textContent = `완료 ${done} / ${TASKS.length} 프레임`;
}
function render() { refreshPanel(); draw(); }

// ---------------------------------------------------------------- actions
function goTo(i) {
  index = Math.max(0, Math.min(TASKS.length - 1, i));
  fitView(); render();
}
function placePoint(imgPt) {
  const next = nextJointIndex();
  if (next < 0) { toast("이 프레임은 모두 찍었습니다. → 로 다음 프레임"); return; }
  current()[JOINTS[next].key] = toOriginal(imgPt);
  saveLabels(); render();
  if (nextJointIndex() < 0) toast("프레임 완료 (→ 다음)");
}
function hideJoint() {
  const next = nextJointIndex();
  if (next < 0) return;
  current()[JOINTS[next].key] = null;
  saveLabels(); render();
}
function undo() {
  const l = current();
  for (let i = JOINTS.length - 1; i >= 0; i--) if (JOINTS[i].key in l) { delete l[JOINTS[i].key]; break; }
  saveLabels(); render();
}
function clearFrame() { delete labels[task().id]; saveLabels(); render(); }

// ---------------------------------------------------------------- pointer / keyboard
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect(); cursor = [e.clientX - r.left, e.clientY - r.top];
  if (drag) {
    if (Math.hypot(cursor[0] - drag.start[0], cursor[1] - drag.start[1]) > DRAG_THRESHOLD) drag.moved = true;
    if (drag.moved && drag.kind === "pan") { view.x = drag.view.x + cursor[0] - drag.start[0]; view.y = drag.view.y + cursor[1] - drag.start[1]; }
    if (drag.moved && drag.kind === "point") current()[drag.key] = toOriginal(screenToImg(cursor));
  }
  draw();
});
canvas.addEventListener("mouseleave", () => { cursor = null; draw(); });
canvas.addEventListener("mousedown", e => {
  const r = canvas.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top];
  const key = pointAt(p[0], p[1]);
  drag = key ? { kind: "point", key, start: p, moved: false } : { kind: "pan", start: p, moved: false, view: { ...view } };
});
window.addEventListener("mouseup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind === "point") { if (d.moved) saveLabels(); render(); return; }
  if (!d.moved) {
    const r = canvas.getBoundingClientRect();
    const sp = [e.clientX - r.left, e.clientY - r.top];
    const ip = screenToImg(sp), im = images[index];
    if (ip[0] >= 0 && ip[1] >= 0 && ip[0] <= im.naturalWidth && ip[1] <= im.naturalHeight) placePoint(ip);
  }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top];
  const before = screenToImg(p);
  view.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, view.zoom * Math.exp(-e.deltaY * 0.0015)));
  view.x = p[0] - before[0] * view.zoom; view.y = p[1] - before[1] * view.zoom;
  draw();
}, { passive: false });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key;
  if (k === "ArrowRight" || k === "Enter") goTo(index + 1);
  else if (k === "ArrowLeft") goTo(index - 1);
  else if (k === "Backspace" || k === "z" || k === "Z") { e.preventDefault(); undo(); }
  else if (k === "o" || k === "O") hideJoint();
  else if (k === "r" || k === "R") { fitView(); draw(); }
  else if (k === "Delete") clearFrame();
});
window.addEventListener("resize", () => { resizeCanvas(); fitView(); render(); });
document.getElementById("prev").onclick = () => goTo(index - 1);
document.getElementById("next").onclick = () => goTo(index + 1);

// ---------------------------------------------------------------- export / import
function buildExport() {
  return {
    version: 1,
    created: new Date().toISOString(),
    note: "human labels; coordinates in original video-frame pixels; null = joint not visible",
    tasks: TASKS.filter(t => isDone(t.id)).map(t => ({
      id: t.id, video: t.video, event_index: t.event_index, event_name: t.event_name, frame_index: t.frame_index,
      width: t.width, height: t.height, joints: Object.fromEntries(JOINTS.map(j => [j.key, labels[t.id][j.key]])),
    })),
  };
}
document.getElementById("export").onclick = () => {
  const data = buildExport();
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "arm_labels.json"; document.body.append(a); a.click(); a.remove();
  toast(`${data.tasks.length}개 프레임 저장 (arm_labels.json)`);
};
document.getElementById("import").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    let n = 0;
    for (const t of data.tasks || []) if (TASKS.some(x => x.id === t.id)) { labels[t.id] = t.joints; n++; }
    saveLabels(); index = firstUnfinished(); fitView(); render(); toast(`${n}개 프레임 불러옴`);
  } catch (err) { toast("불러오기 실패: 올바른 JSON이 아닙니다"); }
  e.target.value = "";
};

// ---------------------------------------------------------------- start
resizeCanvas();
if (!TASKS.length) { document.getElementById("nowJoint").textContent = "프레임이 없습니다"; }
else {
  images.forEach((im, i) => im.addEventListener("load", () => { if (i === index) { fitView(); render(); } }));
  if (images[index].complete) { fitView(); render(); }
}
</script>
</body>
</html>
